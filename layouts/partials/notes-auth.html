<div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-95">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-full mx-4">
        <h2 class="text-2xl font-bold mb-4 text-center text-gray-900 dark:text-white">Area Riservata</h2>
        <p class="mb-6 text-gray-600 dark:text-gray-300 text-center">Inserisci la password per accedere agli appunti.
        </p>

        <form id="auth-form" class="space-y-4">
            <div>
                <input type="password" id="password-input"
                    class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                    placeholder="Password" required>
            </div>
            <button type="submit"
                class="w-full bg-primary-600 text-white font-bold py-2 px-4 rounded hover:bg-primary-700 transition duration-200">
                Accedi
            </button>
            <p id="error-msg" class="text-red-500 text-sm text-center hidden">Password errata</p>
        </form>
    </div>
</div>



<script>
    document.addEventListener('DOMContentLoaded', function () {
        const authOverlay = document.getElementById('auth-overlay');
        const protectedContent = document.getElementById('protected-content');
        const authForm = document.getElementById('auth-form');
        const passwordInput = document.getElementById('password-input');
        const errorMsg = document.getElementById('error-msg');

        // Simple hash check (SHA-256 for "unipass")
        // You can generate new hashes here: https://emn178.github.io/online-tools/sha256.html
        const CORRECT_HASH = '21e28fb24dcb6e32727c0dd63a390245faa35d4cd302c677c0ad02a05f4c9361';

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Check if already authenticated
        if (localStorage.getItem('appunti_auth') === 'true') {
            authOverlay.classList.add('hidden');
            protectedContent.classList.remove('hidden');
        }

        authForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const password = passwordInput.value;
            const hash = await sha256(password);

            if (hash === CORRECT_HASH) {
                localStorage.setItem('appunti_auth', 'true');
                authOverlay.classList.add('hidden');
                protectedContent.classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
                passwordInput.value = '';
            }
        });
    });
</script>
