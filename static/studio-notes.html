<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a2826;
            color: #e8eeed;
            height: 100vh;
            overflow: hidden;
        }

        /* Auth Screen */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: rgba(232, 238, 237, 0.03);
            border: 1px solid rgba(232, 238, 237, 0.1);
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .auth-card h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #e8eeed;
        }

        .auth-card p {
            color: rgba(232, 238, 237, 0.6);
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(232, 238, 237, 0.2);
            border-radius: 6px;
            color: #e8eeed;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        .auth-input:focus {
            outline: none;
            border-color: rgba(20, 243, 217, 0.5);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: rgba(20, 243, 217, 0.15);
            border: 1px solid rgba(20, 243, 217, 0.3);
            border-radius: 6px;
            color: rgb(20, 243, 217);
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-btn:hover {
            background: rgba(20, 243, 217, 0.25);
        }

        .help-text {
            background: rgba(20, 243, 217, 0.08);
            border: 1px solid rgba(20, 243, 217, 0.2);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.85em;
            line-height: 1.6;
            color: rgba(232, 238, 237, 0.8);
        }

        .help-text code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            color: rgb(20, 243, 217);
        }

        /* Main App Layout */
        .app-container {
            display: none;
            height: 100vh;
            display: grid;
            grid-template-columns: 200px 1fr;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(232, 238, 237, 0.03);
            border-right: 1px solid rgba(232, 238, 237, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(232, 238, 237, 0.1);
        }

        .sidebar-header h2 {
            font-size: 1.1em;
            color: #e8eeed;
            font-weight: 600;
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .note-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            color: rgba(232, 238, 237, 0.7);
            border-left: 2px solid transparent;
        }

        .note-item:hover {
            background: rgba(232, 238, 237, 0.05);
            color: #e8eeed;
        }

        .note-item.active {
            background: rgba(20, 243, 217, 0.1);
            border-left-color: rgb(20, 243, 217);
            color: rgb(20, 243, 217);
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(232, 238, 237, 0.1);
        }

        .new-note-btn {
            width: 100%;
            padding: 10px;
            background: rgba(20, 243, 217, 0.1);
            border: 1px solid rgba(20, 243, 217, 0.3);
            border-radius: 6px;
            color: rgb(20, 243, 217);
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .new-note-btn:hover {
            background: rgba(20, 243, 217, 0.2);
        }

        /* Main Editor Area */
        .editor-area {
            display: flex;
            flex-direction: column;
            background: #1f2d2b;
        }

        /* Top Bar with Tabs */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(232, 238, 237, 0.1);
            min-height: 50px;
        }

        .note-tabs {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .note-tab {
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: rgba(232, 238, 237, 0.6);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .note-tab.active {
            color: rgb(20, 243, 217);
            border-bottom-color: rgb(20, 243, 217);
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .top-btn {
            padding: 8px 14px;
            background: rgba(232, 238, 237, 0.05);
            border: 1px solid rgba(232, 238, 237, 0.15);
            border-radius: 5px;
            color: rgba(232, 238, 237, 0.7);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .top-btn:hover {
            background: rgba(232, 238, 237, 0.1);
            color: #e8eeed;
        }

        .top-btn.primary {
            background: rgba(20, 243, 217, 0.15);
            border-color: rgba(20, 243, 217, 0.3);
            color: rgb(20, 243, 217);
        }

        /* Editor Content Container */
        .editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        /* Editor Box (rounded container) */
        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(232, 238, 237, 0.03);
            border: 1px solid rgba(232, 238, 237, 0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(232, 238, 237, 0.08);
        }

        .toolbar-btn {
            padding: 6px 11px;
            background: rgba(232, 238, 237, 0.05);
            border: 1px solid rgba(232, 238, 237, 0.12);
            border-radius: 4px;
            color: rgba(232, 238, 237, 0.65);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85em;
            font-weight: 500;
        }

        .toolbar-btn:hover {
            background: rgba(232, 238, 237, 0.1);
            border-color: rgba(232, 238, 237, 0.25);
            color: #e8eeed;
        }

        .toolbar-sep {
            width: 1px;
            height: 18px;
            background: rgba(232, 238, 237, 0.12);
            margin: 0 6px;
        }

        .editor-header {
            padding: 24px 20px 18px;
            border-bottom: 1px solid rgba(232, 238, 237, 0.08);
        }

        .note-title-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #e8eeed;
            font-size: 1.8em;
            font-weight: 600;
            padding: 0;
            margin-bottom: 12px;
        }

        .note-title-input:focus {
            outline: none;
        }

        .note-title-input::placeholder {
            color: rgba(232, 238, 237, 0.25);
        }

        .note-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            color: rgba(232, 238, 237, 0.45);
            font-size: 0.85em;
        }

        .meta-input {
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(232, 238, 237, 0.12);
            border-radius: 4px;
            color: #e8eeed;
            font-size: 0.9em;
        }

        .meta-input:focus {
            outline: none;
            border-color: rgba(20, 243, 217, 0.4);
            background: rgba(0, 0, 0, 0.4);
        }

        .editor-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .markdown-editor {
            width: 100%;
            min-height: 100%;
            background: transparent;
            border: none;
            color: #e8eeed;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95em;
            line-height: 1.7;
            resize: none;
        }

        .markdown-editor:focus {
            outline: none;
        }

        .markdown-editor::placeholder {
            color: rgba(232, 238, 237, 0.3);
        }

        .preview-content {
            color: rgba(232, 238, 237, 0.9);
            line-height: 1.8;
        }

        .preview-content h1,
        .preview-content h2,
        .preview-content h3 {
            color: #e8eeed;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .preview-content p {
            margin-bottom: 1em;
        }

        .preview-content code {
            background: rgba(232, 238, 237, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            color: rgb(20, 243, 217);
            font-size: 0.9em;
        }

        .preview-content pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(232, 238, 237, 0.1);
            border-radius: 6px;
            padding: 15px;
            overflow-x: auto;
            margin: 1em 0;
        }

        .preview-content pre code {
            background: none;
            color: #e8eeed;
        }

        /* Status Messages */
        .status-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(31, 45, 43, 0.98);
            border: 1px solid rgba(232, 238, 237, 0.2);
            border-radius: 6px;
            color: #e8eeed;
            font-size: 0.9em;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status-toast.success {
            border-left: 3px solid rgb(5, 172, 75);
        }

        .status-toast.error {
            border-left: 3px solid rgb(250, 112, 154);
        }

        .status-toast.info {
            border-left: 3px solid rgb(20, 243, 217);
        }

        .upload-input {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-card">
            <h1>Studio Notes</h1>
            <p>Inserisci il tuo GitHub Personal Access Token</p>
            <div class="help-text">
                <strong>Come creare un PAT:</strong><br>
                1. GitHub → Settings → Developer settings → Personal access tokens<br>
                2. Genera token con permesso <code>repo</code><br>
                3. Copia e incolla qui sotto
            </div>
            <input type="password" class="auth-input" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxx">
            <button class="auth-btn" onclick="saveToken()">Salva Token</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>My Notes</h2>
            </div>
            <div class="notes-list" id="notesList">
                <p style="color: rgba(232, 238, 237, 0.5); font-size: 0.85em; padding: 10px;">Loading...</p>
            </div>
            <div class="sidebar-footer">
                <button class="new-note-btn" onclick="newNote()">+ New Note</button>
            </div>
        </div>

        <!-- Editor Area -->
        <div class="editor-area">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="note-tabs" id="noteTabs">
                    <button class="note-tab active">Untitled</button>
                </div>
                <div class="top-actions">
                    <button class="top-btn" onclick="document.getElementById('uploadInput').click()">Upload</button>
                    <input type="file" id="uploadInput" class="upload-input" accept=".md,.markdown"
                        onchange="uploadFile()">
                    <button class="top-btn primary" onclick="saveNote()">Save</button>
                    <button class="top-btn" onclick="deleteNote()">Delete</button>
                </div>
            </div>

            <!-- Editor Content -->
            <div class="editor-content">
                <!-- Editor Box (rounded container) -->
                <div class="editor-box">
                    <!-- Toolbar -->
                    <div class="toolbar">
                        <button class="toolbar-btn" onclick="insertFormat('**', '**')" title="Bold">B</button>
                        <button class="toolbar-btn" onclick="insertFormat('_', '_')" title="Italic">I</button>
                        <button class="toolbar-btn" onclick="insertFormat('~~', '~~')" title="Strikethrough">S</button>
                        <div class="toolbar-sep"></div>
                        <button class="toolbar-btn" onclick="insertFormat('# ', '')" title="H1">H1</button>
                        <button class="toolbar-btn" onclick="insertFormat('## ', '')" title="H2">H2</button>
                        <button class="toolbar-btn" onclick="insertFormat('### ', '')" title="H3">H3</button>
                        <div class="toolbar-sep"></div>
                        <button class="toolbar-btn" onclick="insertFormat('- ', '')" title="Bullet List">•</button>
                        <button class="toolbar-btn" onclick="insertFormat('1. ', '')" title="Numbered List">1.</button>
                        <div class="toolbar-sep"></div>
                        <button class="toolbar-btn" onclick="insertFormat('[', '](url)')" title="Link">Link</button>
                        <button class="toolbar-btn" onclick="insertFormat('`', '`')" title="Code">&lt;&gt;</button>
                        <button class="toolbar-btn" onclick="insertFormat('```\n', '\n```')" title="Code Block">{
                            }</button>
                        <div class="toolbar-sep"></div>
                        <button class="toolbar-btn" onclick="togglePreview()" id="previewToggle">Preview</button>
                    </div>

                    <div class="editor-header">
                        <input type="text" class="note-title-input" id="noteTitle" placeholder="Untitled">
                        <div class="note-meta">
                            <div class="meta-item">
                                <span class="meta-label">Status</span>
                                <select class="meta-input" id="noteDraft">
                                    <option value="false">Published</option>
                                    <option value="true">Draft</option>
                                </select>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Date</span>
                                <input type="datetime-local" class="meta-input" id="noteDate">
                            </div>
                        </div>
                    </div>
                    <div class="editor-body">
                        <textarea class="markdown-editor" id="noteContent"
                            placeholder="Start writing your notes in markdown..."></textarea>
                        <div class="preview-content" id="previewContent" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-toast" id="statusToast"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const GITHUB_API = 'https://api.github.com';
        const REPO_OWNER = 'FrancescoBertilotti';
        const REPO_NAME = 'FrancescoBertilotti.github.io';
        const NOTES_PATH = 'content/appunti';

        let currentToken = null;
        let currentNotePath = null;
        let allNotes = [];
        let isPreviewMode = false;

        window.onload = function () {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                currentToken = savedToken;
                showApp();
                loadNotes();
            }

            // Set default date
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('noteDate').value = now.toISOString().slice(0, 16);

            // Auto-update preview if in preview mode
            document.getElementById('noteContent').addEventListener('input', () => {
                if (isPreviewMode) updatePreview();
            });
        };

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                showStatus('Please enter a valid token', 'error');
                return;
            }
            currentToken = token;
            localStorage.setItem('github_token', token);
            showApp();
            loadNotes();
            showStatus('Token saved successfully!', 'success');
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'grid';
        }

        async function loadNotes() {
            showStatus('Loading notes...', 'info');
            try {
                const response = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${NOTES_PATH}`, {
                    headers: {
                        'Authorization': `token ${currentToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load notes');

                const files = await response.json();
                allNotes = files.filter(file => file.name.endsWith('.md') && file.name !== '_index.md');
                displayNotes();
                showStatus(`${allNotes.length} notes loaded`, 'success');
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        function displayNotes() {
            const notesList = document.getElementById('notesList');
            if (allNotes.length === 0) {
                notesList.innerHTML = '<p style="color: rgba(232, 238, 237, 0.5); font-size: 0.85em; padding: 10px;">No notes</p>';
                return;
            }
            notesList.innerHTML = allNotes.map(note => `
                <div class="note-item" onclick="loadNote('${note.path}')">
                    ${note.name.replace('.md', '')}
                </div>
            `).join('');
        }

        async function loadNote(path) {
            showStatus('Loading note...', 'info');
            currentNotePath = path;

            try {
                const response = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: {
                        'Authorization': `token ${currentToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load note');

                const file = await response.json();
                const content = atob(file.content);

                // Parse frontmatter
                const frontmatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
                const match = content.match(frontmatterRegex);

                if (match) {
                    const frontmatter = match[1];
                    const body = match[2];

                    const titleMatch = frontmatter.match(/title:\s*["'](.+?)["']/);
                    const dateMatch = frontmatter.match(/date:\s*(.+)/);
                    const draftMatch = frontmatter.match(/draft:\s*(true|false)/);

                    document.getElementById('noteTitle').value = titleMatch ? titleMatch[1] : '';
                    document.getElementById('noteContent').value = body.trim();
                    document.getElementById('noteDraft').value = draftMatch ? draftMatch[1] : 'false';

                    if (dateMatch) {
                        const date = new Date(dateMatch[1].trim());
                        date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
                        document.getElementById('noteDate').value = date.toISOString().slice(0, 16);
                    }
                } else {
                    document.getElementById('noteContent').value = content;
                }

                // Update tab
                const tab = document.querySelector('.note-tab');
                tab.textContent = file.name.replace('.md', '');

                // Update active state
                document.querySelectorAll('.note-item').forEach(item => item.classList.remove('active'));
                event.target.classList.add('active');

                if (isPreviewMode) updatePreview();
                showStatus('Note loaded', 'success');
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        function newNote() {
            currentNotePath = null;
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteDraft').value = 'false';

            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('noteDate').value = now.toISOString().slice(0, 16);

            document.querySelector('.note-tab').textContent = 'Untitled';
            document.querySelectorAll('.note-item').forEach(item => item.classList.remove('active'));
            showStatus('New note ready', 'info');
        }

        async function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value;
            const draft = document.getElementById('noteDraft').value;
            const dateInput = document.getElementById('noteDate').value;

            if (!title) {
                showStatus('Please enter a title', 'error');
                return;
            }

            if (!content) {
                showStatus('Please enter some content', 'error');
                return;
            }

            showStatus('Saving...', 'info');

            const date = new Date(dateInput);
            const frontmatter = `---\ntitle: "${title}"\ndate: ${date.toISOString()}\ndraft: ${draft}\n---\n\n${content}`;

            const filename = currentNotePath ? currentNotePath.split('/').pop() : `${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.md`;
            const path = `${NOTES_PATH}/${filename}`;

            try {
                let sha = null;
                if (currentNotePath) {
                    const getResponse = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentNotePath}`, {
                        headers: {
                            'Authorization': `token ${currentToken}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (getResponse.ok) {
                        const fileData = await getResponse.json();
                        sha = fileData.sha;
                    }
                }

                const response = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${currentToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update note: ${title}`,
                        content: btoa(unescape(encodeURIComponent(frontmatter))),
                        sha: sha
                    })
                });

                if (!response.ok) throw new Error('Failed to save note');

                currentNotePath = path;
                showStatus('✅ Note saved successfully!', 'success');
                setTimeout(() => loadNotes(), 1000);
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }

        async function deleteNote() {
            if (!currentNotePath) {
                showStatus('Select a note to delete', 'error');
                return;
            }

            if (!confirm('Are you sure you want to delete this note?')) return;

            showStatus('Deleting...', 'info');

            try {
                const getResponse = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentNotePath}`, {
                    headers: {
                        'Authorization': `token ${currentToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!getResponse.ok) throw new Error('Note not found');

                const fileData = await getResponse.json();

                const deleteResponse = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${currentNotePath}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${currentToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete note: ${fileData.name}`,
                        sha: fileData.sha
                    })
                });

                if (!deleteResponse.ok) throw new Error('Failed to delete');

                showStatus('🗑️ Note deleted', 'success');
                newNote();
                setTimeout(() => loadNotes(), 1000);
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }

        function uploadFile() {
            const fileInput = document.getElementById('uploadInput');
            const file = fileInput.files[0];

            if (!file) return;

            if (!file.name.endsWith('.md') && !file.name.endsWith('.markdown')) {
                showStatus('Please upload a .md file', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                const frontmatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
                const match = content.match(frontmatterRegex);

                if (match) {
                    const frontmatter = match[1];
                    const body = match[2];

                    const titleMatch = frontmatter.match(/title:\s*["'](.+?)["']/);
                    const dateMatch = frontmatter.match(/date:\s*(.+)/);
                    const draftMatch = frontmatter.match(/draft:\s*(true|false)/);

                    if (titleMatch) document.getElementById('noteTitle').value = titleMatch[1];
                    if (draftMatch) document.getElementById('noteDraft').value = draftMatch[1];
                    if (dateMatch) {
                        const date = new Date(dateMatch[1].trim());
                        date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
                        document.getElementById('noteDate').value = date.toISOString().slice(0, 16);
                    }
                    document.getElementById('noteContent').value = body.trim();
                } else {
                    const filename = file.name.replace(/\.(md|markdown)$/, '');
                    document.getElementById('noteTitle').value = filename;
                    document.getElementById('noteContent').value = content;
                }

                currentNotePath = null;
                showStatus(`File "${file.name}" loaded`, 'success');
                fileInput.value = '';
            };

            reader.readAsText(file);
        }

        function insertFormat(before, after) {
            const textarea = document.getElementById('noteContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            const beforeText = textarea.value.substring(0, start);
            const afterText = textarea.value.substring(end);

            textarea.value = beforeText + before + selectedText + after + afterText;

            const newCursorPos = start + before.length + selectedText.length;
            textarea.focus();
            textarea.setSelectionRange(newCursorPos, newCursorPos);

            if (isPreviewMode) updatePreview();
        }

        function togglePreview() {
            isPreviewMode = !isPreviewMode;
            const editor = document.getElementById('noteContent');
            const preview = document.getElementById('previewContent');
            const btn = document.getElementById('previewToggle');

            if (isPreviewMode) {
                editor.style.display = 'none';
                preview.style.display = 'block';
                btn.textContent = 'Edit';
                updatePreview();
            } else {
                editor.style.display = 'block';
                preview.style.display = 'none';
                btn.textContent = 'Preview';
            }
        }

        function updatePreview() {
            const content = document.getElementById('noteContent').value;
            const preview = document.getElementById('previewContent');
            preview.innerHTML = content.trim() ? marked.parse(content) : '<p style="color: rgba(232, 238, 237, 0.5);">No content to preview</p>';
        }

        function showStatus(message, type) {
            const toast = document.getElementById('statusToast');
            toast.textContent = message;
            toast.className = `status-toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 4000);
        }
    </script>
</body>

</html>
